<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc,
  collection, getCountFromServer
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlxUyaFehxhdiVB9EWIpDHS94ceaH7XG4",
  authDomain: "like-count-eee61.firebaseapp.com",
  projectId: "like-count-eee61",
  storageBucket: "like-count-eee61.firebasestorage.app",
  messagingSenderId: "843855615024",
  appId: "1:843855615024:web:8a8701df05d23c7b1709f5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

const errText = e => ({
  "auth/email-already-in-use": "Ei email diye account already ache",
  "auth/invalid-email": "Email thik nai",
  "auth/weak-password": "Password komport 6 character dao",
  "auth/invalid-credential": "Email ba password bhul",
  "auth/missing-password": "Password din",
  "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "Firebase API key bhul"
}[e.code] || (e.code + " : " + e.message));

async function refreshLikes(user) {
  try {
    const snap = await getCountFromServer(collection(db, "likes"));
    $("count").textContent = snap.data().count;
    const mine = await getDoc(doc(db, "likes", user.uid));
    $("likeBtn").textContent = mine.exists() ? "❤️ Liked" : "👍 Like";
  } catch (e) { console.error(e); }
}

onAuthStateChanged(auth, user => {
  if (user) {
    $("authBox").style.display = "none";
    $("appBox").style.display = "block";
    $("who").textContent = user.email;
    refreshLikes(user);
  } else {
    $("authBox").style.display = "block";
    $("appBox").style.display = "none";
  }
});

$("signupBtn").addEventListener("click", async () => {
  try {
    await createUserWithEmailAndPassword(auth, $("email").value, $("password").value);
    $("msg").textContent = "";
  } catch (e) { $("msg").textContent = errText(e); }
});

$("loginBtn").addEventListener("click", async () => {
  try {
    await signInWithEmailAndPassword(auth, $("email").value, $("password").value);
    $("msg").textContent = "";
  } catch (e) { $("msg").textContent = errText(e); }
});

$("logoutBtn").addEventListener("click", () => signOut(auth));

$("likeBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) return;
  try {
    const ref = doc(db, "likes", user.uid);
    const mine = await getDoc(ref);
    if (mine.exists()) await deleteDoc(ref);
    else await setDoc(ref, { uid: user.uid, at: Date.now() });
    refreshLikes(user);
  } catch (e) { alert(errText(e)); }
});
</script>
